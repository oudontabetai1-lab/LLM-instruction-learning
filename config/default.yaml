# LLM Instruction Learning Platform — パイプライン設定

teacher:
  # 教師モデル(上位LLM)。provider: ollama | bedrock
  provider: ollama
  model: llama3.3:70b
  # provider: ollama のときの接続先。GPU EC2 上の Ollama を指す場合は書き換える
  ollama_host: http://localhost:11434
  # provider: bedrock のときのモデル ID とリージョン
  bedrock_model_id: anthropic.claude-sonnet-4-5-20250929-v1:0
  aws_region: ap-northeast-1
  temperature: 0.9
  max_tokens: 2048

student:
  # 学習対象の下位モデル(Hugging Face ID)
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  # Ollama に登録するときのモデル名
  ollama_name: itl-student
  ollama_host: http://localhost:11434

generation:
  seed_path: data/seed_tasks.jsonl
  output_path: data/generated/instructions.jsonl
  # 生成する指示データの目標件数
  num_instructions: 1000
  # 1 回の教師呼び出しで生成させる件数
  batch_size: 5
  # プロンプトに例示するシード/生成済みタスク数
  num_prompt_examples: 3
  language: ja

curation:
  input_path: data/generated/instructions.jsonl
  output_dir: data/curated
  # ROUGE-L 風の類似度がこの値以上なら重複として除外
  similarity_threshold: 0.7
  min_instruction_chars: 8
  min_output_chars: 20
  val_ratio: 0.05

training:
  dataset_dir: data/curated
  output_dir: outputs/checkpoints
  epochs: 3
  learning_rate: 2.0e-4
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 2048
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

export:
  # llama.cpp のリポジトリパス(convert_hf_to_gguf.py を使用)
  llama_cpp_dir: ~/llama.cpp
  quantization: q4_k_m
  output_dir: outputs/gguf

evaluation:
  # 評価に使う val データ(curate の出力)
  dataset_path: data/curated/val.jsonl
  num_samples: 50
  report_path: outputs/eval/report.json

aws:
  # 空文字列なら S3 同期をスキップ
  s3_bucket: ""
  s3_prefix: llm-itl
