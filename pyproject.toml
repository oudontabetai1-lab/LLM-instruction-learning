[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-instruction-learning"
version = "0.1.0"
description = "Teacher/student instruction-tuning platform: generate instruction data with a large LLM and fine-tune small models served via Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "trl>=0.18",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
itl = "itl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
